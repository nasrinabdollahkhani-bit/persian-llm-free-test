name: Authorized Persian Qwen Quality V2 (CPU, Synthetic)

on:
  workflow_dispatch:
    inputs:
      response_count:
        description: 'Public synthetic Persian replies per run (5 to 10); quality-v2 profile'
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '6'
          - '7'
          - '8'
          - '9'
          - '10'

permissions:
  contents: read

concurrency:
  group: synthetic-qwen-five-responses
  cancel-in-progress: false

jobs:
  five_cpu_responses:
    name: Generate 5-10 synthetic Persian replies (quality v2)
    if: >-
      github.repository == 'nasrinabdollahkhani-bit/persian-llm-free-test' &&
      github.actor == 'nasrinabdollahkhani-bit' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      CUDA_VISIBLE_DEVICES: ''
      MODEL_DIR: /tmp/morteza5-qwen-staged
      PY_VENV: /tmp/morteza5-qwen-runtime
      RESPONSE_COUNT: ${{ inputs.response_count }}
    steps:
      - name: Enforce owner authorization for at most 5 new manual retries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          count = int(os.environ['RESPONSE_COUNT'])
          if not (2 <= n <= 6 and attempt == 1 and 5 <= count <= 10):
              raise SystemExit('BLOCKED: OWNER_FIVE_RETRIES_OR_COUNT_SCOPE_EXCEEDED')
          print(f'AUTHORIZED_RETRY_SLOT: {n - 1}/5; SYNTHETIC_RESPONSES_REQUESTED: {count}')
          PY

      - name: Checkout only approved public synthetic scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run no-model quality-v2 contract checks before any downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts -p 'test_qwen_farsi_quality_v2.py' -v

      - name: Verify temporary free runner resources
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/runner_preflight.py

      - name: Fail early if kernel outbound controls are unavailable
        shell: bash
        run: |
          set -euo pipefail
          command -v sudo
          command -v iptables
          command -v ip6tables
          sudo iptables -L OUTPUT >/dev/null
          sudo ip6tables -L OUTPUT >/dev/null
          echo "NETWORK_GUARD_PREREQUISITES_PRESENT"

      - name: Install version-pinned CPU runtime (no CUDA)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$PY_VENV"
          "$PY_VENV/bin/python" -m pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          "$PY_VENV/bin/python" -m pip install --no-cache-dir \
            --index-url https://pypi.org/simple \
            'transformers==4.51.3' 'tokenizers==0.21.1' \
            'safetensors==0.5.3' 'huggingface-hub==0.30.2'
          "$PY_VENV/bin/python" -m pip check
          "$PY_VENV/bin/python" - <<'PY'
          import torch, transformers, tokenizers, safetensors, huggingface_hub
          assert torch.__version__.split('+')[0] == '2.6.0'
          assert torch.version.cuda is None and not torch.cuda.is_available()
          assert transformers.__version__ == '4.51.3'
          assert tokenizers.__version__ == '0.21.1'
          assert safetensors.__version__ == '0.5.3'
          assert huggingface_hub.__version__ == '0.30.2'
          print('CPU_RUNTIME_DIRECT_VERSION_CHECK_PASS')
          PY
          "$PY_VENV/bin/python" -m pip freeze --all > runtime_versions.txt

      - name: Re-acquire exactly 7 pinned public files and verify all 7 SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          python3 -B scripts/stage_verified_qwen_for_five.py "$MODEL_DIR"

      - name: Fail-closed dedicated-user firewall and run quality-v2 synthetic inference
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v iptables >/dev/null || ! command -v ip6tables >/dev/null; then
            echo "BLOCKED: LINUX_IPTABLES_FIREWALL_UNAVAILABLE"
            exit 2
          fi
          if id qwen_infer >/dev/null 2>&1; then
            echo "BLOCKED: DEDICATED_INFERENCE_ID_ALREADY_EXISTS"
            exit 2
          fi
          sudo useradd --system --create-home --user-group --shell /bin/sh qwen_infer
          sudo install -d -o qwen_infer -g qwen_infer -m 0755 /tmp/morteza5-qwen-output
          sudo install -o root -g root -m 0644 "$GITHUB_WORKSPACE/scripts/qwen_farsi_quality_v2.py" /tmp/morteza5-qwen-smoke.py
          sudo -u qwen_infer test -r /tmp/morteza5-qwen-smoke.py
          echo "DEDICATED_INFERENCE_USER_SCRIPT_READABLE"
          chmod 755 "$MODEL_DIR"
          chmod 644 "$MODEL_DIR"/*
          infer_uid="$(id -u qwen_infer)"
          four_enabled=0
          six_enabled=0
          restore_network() {
            if [ "$six_enabled" -eq 1 ]; then
              sudo ip6tables -D OUTPUT -m owner --uid-owner "$infer_uid" -j REJECT || true
            fi
            if [ "$four_enabled" -eq 1 ]; then
              sudo iptables -D OUTPUT -m owner --uid-owner "$infer_uid" -j REJECT || true
            fi
          }
          trap restore_network EXIT
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$infer_uid" -j REJECT
          four_enabled=1
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner "$infer_uid" -j REJECT
          six_enabled=1
          sudo iptables -C OUTPUT -m owner --uid-owner "$infer_uid" -j REJECT
          sudo ip6tables -C OUTPUT -m owner --uid-owner "$infer_uid" -j REJECT
          if sudo -u qwen_infer curl --location --silent --max-time 3 https://example.com >/dev/null 2>&1; then
            echo "BLOCKED: INFERENCE_USER_NETWORK_EGRESS_STILL_ALLOWED"
            exit 2
          fi
          echo "INFERENCE_DEDICATED_UID_IPV4_IPV6_EGRESS_BLOCKED"
          sudo -u qwen_infer env \
            HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 \
            HF_HUB_DISABLE_TELEMETRY=1 TOKENIZERS_PARALLELISM=false \
            CUDA_VISIBLE_DEVICES='' OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 \
            timeout --signal=TERM --kill-after=15s 20m \
            "$PY_VENV/bin/python" -B /tmp/morteza5-qwen-smoke.py \
              --model-dir "$MODEL_DIR" \
              --output /tmp/morteza5-qwen-output/farsi_quality_v2_responses.json \
              --count "$RESPONSE_COUNT"
          cp /tmp/morteza5-qwen-output/synthetic_persian_responses.json \
            farsi_quality_v2_responses.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("farsi_quality_v2_responses.json").read_text(encoding="utf-8"))
          answers = result.get("answers", [])
          expected = int(__import__("os").environ["RESPONSE_COUNT"])
          if len(answers) != expected or result.get("requested_response_count") != expected or result.get("profile") != "FA_QUALITY_V2_NONTHINKING_SAMPLING" or any(not a.get("raw_model_response", "").strip() for a in answers):
              raise SystemExit("BLOCKED: INCOMPLETE_OR_EMPTY_RESPONSES")
          print(f"REAL_LOCAL_PERSIAN_RESPONSES: {expected}/{expected}; QUALITY_REQUIRES_HUMAN_REVIEW")
          PY

      - name: Delete all temporary model and runtime bytes
        if: always()
        shell: bash
        run: |
          rm -rf -- "$MODEL_DIR" "$PY_VENV"
          sudo rm -rf -- /tmp/morteza5-qwen-output /tmp/morteza5-qwen-smoke.py
          echo "EPHEMERAL_MODEL_RUNTIME_AND_TMP_OUTPUT_REMOVED"

      - name: Upload text and hashes only, NEVER model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-synthetic-persian-quality-v2-and-receipts
          path: |
            preflight.json
            runtime_versions.txt
            five_response_model_stage_receipt.json
            synthetic_persian_responses.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
